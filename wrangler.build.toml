# Build-only config for `wrangler build` in the cf-bundle step.
# Must NOT contain pages_build_output_dir (that makes wrangler treat the
# project as a Pages project and refuse to bundle a Worker).
name = "spill"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = true

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "spill"

[[d1_databases]]
binding = "DB"
database_name = "spill"
database_id = "7ad0a548-84e5-440e-8ce7-65ebe09742f2"

[images]
binding = "IMAGES"
